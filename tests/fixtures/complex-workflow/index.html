<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>订单工作台</title>
<style>body{font:16px system-ui;margin:32px;max-width:1000px}label{display:block;margin:14px 0}input,select,button{font:inherit;padding:7px}table{border-collapse:collapse;margin:20px 0}td,th{padding:8px 24px;border-bottom:1px solid #ddd}iframe{height:100px;border:1px solid #ccc;width:600px}a{margin-right:24px}</style>
<h1>订单工作台</h1><a href="/policy" target="_blank">国际配送规则</a><a href="/receipts" target="_blank">订单回执</a>
<section id="list"><label>筛选状态<select id="filter" aria-label="筛选状态"><option value="all">全部</option><option value="pending">待处理</option></select></label><div id="rows"></div><button id="next">下一页</button></section>
<section id="editor" hidden><h2>新建订单</h2><label>客户名称<input id="customer" aria-label="客户名称"></label><label>区域<select id="region" aria-label="区域"><option value="domestic">国内</option><option value="international">国际</option></select></label><div id="conditional"></div><delivery-choice></delivery-choice><iframe title="联系人" src="/contact"></iframe><label>订单附件<input id="attachment" aria-label="订单附件" type="file"></label><p id="fileStatus">尚未上传</p><button id="validate">检查订单</button><button id="save" disabled>提交订单</button><p id="status" role="status">请填写订单</p></section>
<script>
const status=document.getElementById('status');
let page=1,contact='',uploaded='';
const list=[{name:'Ada Studio',status:'pending'},{name:'Bright Labs',status:'done'},{name:'Cedar',status:'pending'},{name:'Delta',status:'pending'}];
function render(){const data=filter.value==='pending'?list.filter(x=>x.status==='pending').reverse():list;const visible=data.slice((page-1)*2,page*2);rows.innerHTML='<table><tr><th>客户</th><th>状态</th><th>操作</th></tr>'+visible.map(x=>'<tr><td>'+x.name+'</td><td>'+x.status+'</td><td><button data-name="'+x.name+'">处理 '+x.name+'</button></td></tr>').join('')+'</table><p>第 '+page+' 页</p>';next.disabled=page*2>=data.length;document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{editor.hidden=false;customer.value=b.dataset.name;});}
filter.onchange=()=>{page=1;rows.textContent='载入中';setTimeout(render,450);};next.onclick=()=>{page++;rows.textContent='载入中';setTimeout(render,450);};render();
region.onchange=()=>{conditional.textContent='正在查询区域要求';save.disabled=true;setTimeout(()=>{conditional.innerHTML=region.value==='international'?'<label>税号<input id="tax" aria-label="税号"></label>':'';},450);};
customElements.define('delivery-choice',class extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<label>配送方式<select aria-label="配送方式"><option value="standard">standard</option><option value="express">express</option></select></label>';}});
window.onmessage=e=>{if(e.origin===location.origin)contact=e.data.contact;};
attachment.onchange=async()=>{const file=attachment.files[0];uploaded='';if(!file)return;fileStatus.textContent='正在上传';const r=await fetch('/api/upload',{method:'POST',body:await file.text()});if((await r.json()).ok){uploaded=file.name;fileStatus.textContent='附件已验证：'+file.name;}else fileStatus.textContent='附件内容不正确';};
function values(){return {customer:customer.value,region:region.value,tax:document.querySelector('#tax')?.value||'',shipping:document.querySelector('delivery-choice').shadowRoot.querySelector('select').value,contact,attachment:uploaded};}
validate.onclick=()=>{status.textContent='正在校验';save.disabled=true;setTimeout(()=>{const v=values();const errors=[];if(v.customer!=='Ada Studio')errors.push('请核对客户');if(v.region==='international'&&v.tax!=='INT-2048')errors.push('国际税号应为 INT-2048');if(!v.contact.endsWith('@example.test'))errors.push('请填写联系邮箱');if(!v.attachment)errors.push('请上传订单附件');status.textContent=errors.length?errors.join('；'):'校验通过，可以提交';save.disabled=!!errors.length;},550);};
save.onclick=async()=>{save.disabled=true;status.textContent='正在提交';try{const r=await fetch('/api/save'+location.search,{method:'POST',body:JSON.stringify(values())});const v=await r.json();if(!r.ok)throw Error(v.error);status.textContent='已保存 '+v.id;}catch(e){status.textContent='提交回执未收到；请打开订单回执核对，勿重复提交';}};
</script></html>
